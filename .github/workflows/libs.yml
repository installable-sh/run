name: Update Dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 6" # Weekly on Saturday at noon UTC (after lib releases Friday night)

jobs:
  update-lib:
    uses: installable-sh/docker/.github/workflows/update-lib.yml@main
    permissions:
      contents: write

  release:
    needs: update-lib
    if: needs.update-lib.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/release.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
